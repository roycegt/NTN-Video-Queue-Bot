name: Daily Video Cards

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  create-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests
      - run: python daily_video_cards.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
